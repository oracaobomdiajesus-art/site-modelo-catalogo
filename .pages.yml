media:
  input: "static/img"
  output: "/img"

content:
  - name: "central-acessos"
    label: "🔗 Central de Acessos"
    type: "file"
    path: "content/central-acessos.md"
    format: "yaml-frontmatter"
    fields:
      - name: "body"
        label: "Links das plataformas deste cliente"
        description: "Cole aqui o link de cada plataforma na frente do nome. Pode apagar o que não usar e acrescentar outras."
        type: "text"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "never"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "never"
            hidden: true

  - name: "profile"
    label: "Perfil"
    type: "file"
    path: "content/_index.md"
    format: "yaml-frontmatter"
    fields:
      - name: "title"
        label: "Nome do negócio"
        type: "string"
        required: true
      - name: "bio"
        label: "Biografia / descrição curta"
        type: "text"
      - name: "foto_perfil"
        label: "Foto de perfil"
        type: "image"
      - name: "instagram_url"
        label: "URL do Instagram"
        description: "Opcional"
        type: "string"
      - name: "whatsapp_url"
        label: "URL do WhatsApp"
        description: "Ex: https://wa.me/55SEUNUMERO"
        type: "string"
      - name: "google_avaliacao_url"
        label: "Link para avaliar no Google"
        description: "Opcional"
        type: "string"
      - name: "chave_pix"
        label: "Chave Pix"
        description: "Ou Pix copia e cola. Opcional — o botão de Pix só aparece se preenchido"
        type: "string"
      - name: "video_youtube_url"
        label: "Link do vídeo no YouTube"
        description: "Opcional"
        type: "string"
      - name: "video_titulo"
        label: "Título/legenda do vídeo"
        description: "Opcional"
        type: "string"
      - name: "tema_cor"
        label: "Tema de cor do site"
        type: "select"
        default: "marrom"
        options:
          values:
            - value: "marrom"
              label: "Marrom/Bege (padrão)"
            - value: "verde"
              label: "Verde"
            - value: "rosa"
              label: "Rosa"
            - value: "azul"
              label: "Azul"
      - name: "cor_primaria"
        label: "Cor primária personalizada"
        description: "Opcional. Preencha esta E a de baixo (em hexadecimal, ex: #2E7D32) para usar uma cor sua em vez de um dos temas prontos acima"
        type: "string"
      - name: "cor_secundaria"
        label: "Cor secundária personalizada"
        description: "Opcional, usada em fundos e detalhes claros. Ex: #C8E6C9"
        type: "string"
      - name: "fundo_ativo"
        label: "Usar imagem de fundo no site"
        description: "Liga ou desliga a foto de fundo escolhida abaixo"
        type: "boolean"
        default: false
      - name: "fundo_foto"
        label: "Foto de fundo"
        description: "Só aparece se a opção acima estiver ligada"
        type: "image"
      - name: "fundo_opacidade"
        label: "Opacidade da camada sobre a imagem de fundo"
        description: "De 0 (foto bem viva, quase sem filtro) a 100 (foto quase escondida). Sugestão: entre 30 e 55."
        type: "number"
        default: 40
      - name: "cardapio_ativo"
        label: "Mostrar tabela de preços?"
        description: "Lista de itens com preço, organizada por categoria (tipo cardápio de restaurante ou tabela de preços de salão/clínica) — separada do catálogo com carrinho"
        type: "boolean"
        default: false
      - name: "cardapio_titulo"
        label: "Título da tabela de preços"
        type: "string"
      - name: "cardapio_subtitulo"
        label: "Subtítulo da tabela de preços"
        description: "Opcional"
        type: "string"

  - name: "links"
    label: "Links"
    type: "collection"
    path: "content/links"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, link_url, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "slug"
        label: "Identificador (slug)"
        type: "string"
        required: true
      - name: "title"
        label: "Título do link"
        type: "string"
        required: true
      - name: "link_url"
        label: "URL de destino"
        type: "string"
        required: true
      - name: "icone"
        label: "Ícone"
        description: "Classe Font Awesome, opcional. Ex: fa-solid fa-location-dot"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "categorias"
    label: "Categorias do Catálogo"
    type: "collection"
    path: "content/categorias"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, ativo]
      default:
        sort: "title"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome da categoria"
        type: "string"
        required: true
      - name: "ativo"
        label: "Categoria ativa"
        description: "Desligue para esconder todos os produtos dela de uma vez"
        type: "boolean"
        default: true

  - name: "produtos"
    label: "Produtos do Catálogo"
    type: "collection"
    path: "content/produtos"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, categoria, preco, ativo, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "slug"
        label: "Identificador (slug)"
        type: "string"
        required: true
      - name: "title"
        label: "Nome do produto"
        type: "string"
        required: true
      - name: "preco"
        label: "Preço cheio"
        description: "Em reais, ex: 12.50"
        type: "number"
        required: true
      - name: "codigo"
        label: "Código do produto"
        description: "Opcional. Ex: 001, 002 — você escolhe"
        type: "string"
      - name: "em_promocao"
        label: "Produto em promoção?"
        type: "boolean"
        default: false
      - name: "preco_promocional"
        label: "Preço promocional"
        description: "Em reais, ex: 9.90 — só vale se 'Produto em promoção' estiver ligado"
        type: "number"
      - name: "exposicao"
        label: "Destaque na página inicial"
        description: "Só vale se o produto estiver em promoção"
        type: "boolean"
        default: false
      - name: "foto"
        label: "Foto do produto"
        type: "image"
      - name: "descricao"
        label: "Descrição"
        type: "text"
      - name: "categoria"
        label: "Categoria"
        type: "reference"
        required: true
        options:
          collection: "categorias"
          value: "{fields.title}"
          label: "{fields.title}"
      - name: "estoque_site"
        label: "Estoque exibido no site"
        description: "Opcional — deixe em branco se não quiser mostrar. 0 mostra 'Esgotado'"
        type: "number"
      - name: "ativo"
        label: "Produto ativo"
        description: "Aparece no catálogo quando ligado"
        type: "boolean"
        default: true
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "cardapio"
    label: "Tabela de Preços"
    type: "collection"
    path: "content/cardapio"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, categoria, preco, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome do item/serviço"
        type: "string"
        required: true
      - name: "preco"
        label: "Preço"
        description: "Em reais, ex: 50.00"
        type: "number"
        required: true
      - name: "categoria"
        label: "Categoria"
        description: "Texto livre para agrupar os itens"
        type: "string"
        required: true
      - name: "descricao"
        label: "Observação"
        description: "Opcional"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "galeria"
    label: "Galeria de Fotos"
    type: "collection"
    path: "content/galeria"
    format: "yaml-frontmatter"
    view:
      primary: "legenda"
      fields: [legenda, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "foto"
        label: "Foto"
        type: "image"
        required: true
      - name: "legenda"
        label: "Legenda"
        description: "Opcional"
        type: "text"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true
